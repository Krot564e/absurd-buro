# Бесплатный деплой на Render: https://render.com
services:
  - type: web
    name: absurd-buro
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECURE_COOKIES
        value: "1"
      - key: LIMIT_GLOBAL
        value: "400"
